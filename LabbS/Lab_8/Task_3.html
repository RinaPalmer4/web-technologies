<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kanban Board</title>
    <link rel="stylesheet" href="style_3.css">
</head>
<body>

<div class="kanban-board">

    <div class="kanban-column">
        <div class="column-header header-todo">To do</div>
        <div class="column-content">
            <div class="task-card" draggable="true">Item #9</div>
            <div class="task-card" draggable="true">Item #3</div>
            <div class="task-card" draggable="true">Item #5</div>
            <div class="task-card" draggable="true">Item #4</div>
        </div>
    </div>

    <div class="kanban-column">
        <div class="column-header header-working">Working</div>
        <div class="column-content">
            <div class="task-card" draggable="true">Item #6</div>
            <div class="task-card" draggable="true">Item #8</div>
            <div class="task-card" draggable="true">Item #7</div>
        </div>
    </div>

    <div class="kanban-column">
        <div class="column-header header-done">Done</div>
        <div class="column-content">
            <div class="task-card" draggable="true">Item #11</div>
            <div class="task-card" draggable="true">Item #2</div>
            <div class="task-card" draggable="true">Item #13</div>
            <div class="task-card" draggable="true">Item #14</div>
        </div>
    </div>

</div>

<script src="script_3.js"></script>
</body>
</html>
