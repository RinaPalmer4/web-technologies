<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab 9 - Forms</title>
    <link rel="stylesheet" href="style1.css">
</head>
<body>

<div class="form-container">
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('signup')">Signup</button>
        <button class="tab-btn" onclick="switchTab('login')">Login</button>
    </div>

    <form id="signupForm" class="auth-form active-form" novalidate>
        <h2>Create an account</h2>

        <div class="form-group">
            <label>First Name</label>
            <input type="text" name="firstName" id="firstName" placeholder="Mark">
            <span class="error-text"></span>
        </div>

        <div class="form-group">
            <label>Last Name</label>
            <input type="text" name="lastName" id="lastName" placeholder="Otto">
            <span class="error-text"></span>
        </div>

        <div class="form-group">
            <label>Email</label>
            <input type="email" name="email" id="email" placeholder="Enter email">
            <span class="error-text"></span>
        </div>

        <div class="form-group password-group">
            <label>Password</label>
            <input type="password" name="password" id="signupPassword" placeholder="Enter password">
            <button type="button" class="toggle-pwd" onclick="togglePassword('signupPassword')">👁️</button>
            <span class="error-text"></span>
        </div>

        <div class="form-group password-group">
            <label>Confirm Password</label>
            <input type="password" name="confirmPassword" id="confirmPassword" placeholder="Confirm password">
            <button type="button" class="toggle-pwd" onclick="togglePassword('confirmPassword')">👁️</button>
            <span class="error-text"></span>
        </div>

        <div class="form-group">
            <label>Phone</label>
            <input type="text" name="phone" id="phone" placeholder="+380...">
            <span class="error-text"></span>
        </div>

        <div class="form-group">
            <label>Date of Birth</label>
            <input type="date" name="dob" id="dob">
            <span class="error-text"></span>
        </div>

        <div class="form-group">
            <label>Sex</label>
            <select name="sex" id="sex">
                <option value="">Select...</option>
                <option value="male">Male</option>
                <option value="female">Female</option>
            </select>
            <span class="error-text"></span>
        </div>

        <div class="form-group">
            <label>Country</label>
            <select name="country" id="country">
                <option value="">Choose...</option>
                <option value="Ukraine">Ukraine</option>
                <option value="UK">United Kingdom</option>
                <option value="USA">USA</option>
            </select>
            <span class="error-text"></span>
        </div>

        <div class="form-group">
            <label>City</label>
            <select name="city" id="city" disabled>
                <option value="">Please select a country first</option>
            </select>
            <span class="error-text"></span>
        </div>

        <button type="submit" class="submit-btn">Signup</button>
        <div id="signupSuccess" class="success-message"></div>
    </form>

    <form id="loginForm" class="auth-form" novalidate>
        <h2>Login here</h2>

        <div class="form-group">
            <label>Username</label>
            <input type="text" name="loginUsername" id="loginUsername" placeholder="Enter username">
            <span class="error-text"></span>
        </div>

        <div class="form-group password-group">
            <label>Password</label>
            <input type="password" name="loginPassword" id="loginPassword" placeholder="Enter password">
            <button type="button" class="toggle-pwd" onclick="togglePassword('loginPassword')">👁️</button>
            <span class="error-text"></span>
        </div>

        <div class="form-group checkbox-group">
            <input type="checkbox" name="rememberMe" id="rememberMe">
            <label for="rememberMe">Remember Me</label>
        </div>

        <button type="submit" class="submit-btn">Login</button>
        <div id="loginSuccess" class="success-message"></div>
    </form>
</div>

<script src="script1.js"></script>
</body>
</html>
