<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Wild Gunman</title>
    <link rel="stylesheet" href="style.css"/>
</head>
<body>

<section class="game-menu" id="menu-screen">
    <h1 class="game-menu__title">Wild Gunman</h1>
    <button class="button button-start-game" id="btn-start">Start Game</button>
</section>

<div class="wrapper" id="game-wrapper">
    <section class="game-panels">
        <div class="players-panel">
            <div class="players-panel__gunman">Gunman</div>
            <div class="players-panel__you">Time.You</div>
        </div>
        <div class="white-line"></div>
        <div class="time-panel">
            <div class="time-panel__gunman" id="time-gunman">0.00</div>
            <div class="time-panel__you" id="time-player">0.00</div>
        </div>
        <div class="score-panel">
            <div class="score-panel__score">Score:<span class="score-panel__score_num" id="score-display">0</span></div>
            <div class="score-panel__level" id="level-display">Level 1</div>
        </div>
    </section>

    <div class="message hidden" id="message-box"></div>

    <section class="game-screen">
        <div id="gunman"></div>

        <button class="button button-restart hidden" id="btn-restart">Restart</button>
        <button class="button button-next-level hidden" id="btn-next">Next Level</button>
    </section>
</div>

<script src="script.js"></script>
</body>
</html>
